<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AVL Tree Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>AVL Tree Visualizer</h1>

<div class="controls">
    <input type="number" id="valueInput" placeholder="Enter value">
    <button onclick="insert()">Insert</button>
    <button onclick="deleteNode()">Delete</button>
    <button onclick="resetTree()">Reset</button>
</div>

<div id="operation">Operation: None</div>

<!-- IMPORTANT: SVG must have fixed height -->
<svg id="treeCanvas" width="100%" height="500"></svg>

<script src="script.js"></script>
</body>
</html>
